name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Run tests
        run: go test ./src/...

      - name: Build binary
        run: GOOS=linux GOARCH=amd64 go build -o hdbbackint ./src/

      - name: Package release asset
        run: zip hdbbackint-linux-amd64.zip hdbbackint src/hdbbackint.cfg LICENSE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: hdbbackint-linux-amd64.zip
