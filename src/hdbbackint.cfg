# Sample S3 Configuration for hdbbackint
# This file should be located at /usr/sap/<SID>/SYS/global/hdb/opt/init<SID>.utl
# and the database passes to hdbbackint via the -p option.

# ---------------------------------------------------------------------------
# Mandatory parameters — startup fails if any of these are missing.
# ---------------------------------------------------------------------------

SCI_accessKey=<YOUR_ACCESS_KEY>
SCI_secretKey=<YOUR_SECRET_KEY>
SCI_bucketName=<Bucket_Name>

# Maintain the permissions of this file to ensure that only authorized users can read it,
# as it contains sensitive information (access key and secret key).

# ---------------------------------------------------------------------------
# Region and endpoint — must be set together or omitted together.
# On standard SCI VMs, both can be omitted: they are auto-detected from the
# instance metadata service (http://169.254.169.254/openstack/latest/meta_data.json).
#
# Set both explicitly when:
#   - Writing backups to a bucket in a DIFFERENT region from the VM (cross-region).
#   - Running outside SCI (no metadata service available).
#   - You want deterministic config with no runtime HTTP calls.
#
# Behaviour:
#   Both set    → used as-is (no metadata call)
#   Neither set → both auto-detected from instance metadata using SCI_endpoint_template
#   Only one set → startup fails with a clear error
# ---------------------------------------------------------------------------

# SCI_region=eu-de-1
# SCI_endpoint=https://rgw.st1.eu-de-1.cloud.sap

# Template used to derive SCI_endpoint from the auto-detected region.
# The placeholder {region} is replaced with the region at runtime.
# Override this when using a non-SCI S3-compatible storage backend.
# Default: https://rgw.st1.{region}.cloud.sap
# SCI_endpoint_template=https://rgw.st1.{region}.cloud.sap

# ---------------------------------------------------------------------------
# Optional parameters — defaults are used when not present.
# ---------------------------------------------------------------------------

# Top-level folder prefix inside the bucket for all backup objects.
# Default: (none — objects are written directly at the bucket root)
# SCI_folderName=hana-backups

# Use path-style S3 URLs (required for most CEPH RGW deployments).
# Default: false
# SCI_s3ForcePathStyle=true

# Shorten the S3 object key by stripping /usr/sap/<SID>/.../backint/ from the path.
# Stored as: [FolderName/]<SID>/<DBNAME>/<file>/<EBID>.bak
# The SID is preserved in the key so that multi-system environments remain correctly scoped.
# Default: false
# shorten_folder_path=false

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

# Diagnostic logging: log_file and log_level must be set together.
# When unset, logging is disabled (no output).
#
# NOTE: log_file, log_level, and log_rotate_frequency are fixed for the lifetime
# of the process. If HANA overrides the parameter file at runtime via
# #TOOLOPTION PARAMETER_FILE=..., only the S3 connection parameters are reloaded —
# the log file from the original -p parameter file remains open and in use.
# This is intentional: the log file is opened at startup before input is parsed,
# so that all errors (including config load failures) are captured. Switching log
# files mid-run would split the session log across two files.
# log_file=/var/log/hdbbackint/hdbbackint.log
# log_level=debug

# Log file rotation frequency: day, hour, minute, never.
# Rotated files are renamed to <log_file>.<timestamp>.
# Recommended: day (one file per day; easy to archive and retain).
# Use hour only if a single day's log grows excessively large.
# minute is intended for short debugging sessions only — it produces
# dozens of small files per hour and is not suitable for production.
# Default: never
#
# NOTE: Rotation is lazy — it fires on the first log write after a boundary
# is crossed within a single hdbbackint process. Each HANA backup file is
# handled by a separate short-lived process. Whether rotation triggers depends
# on how long that process runs:
#   - Test environments (small data, fast network): shards complete in seconds,
#     rotation will not fire.
#   - Production environments (large shards, e.g. 100+ GiB): upload can take
#     many minutes, crossing minute/hour/day boundaries — rotation fires correctly.
# For short-lived workloads, use log_rotate_frequency=never and manage rotation
# externally via logrotate or similar.
# log_rotate_frequency=day

# ---------------------------------------------------------------------------
# TOOLOPTION — runtime parameter override via HANA backup SQL command
# ---------------------------------------------------------------------------
#
# HANA passes the TOOLOPTION string from the SQL backup command transparently
# to hdbbackint via the #TOOLOPTION line in the input file. Two formats are
# supported:
#
# Format 1 — Replace the entire parameter file at runtime:
#
#   BACKUP DATA ALL USING BACKINT ('...') TOOLOPTION 'PARAMETER_FILE=/path/to/file.cfg'
#
#   - All parameters are loaded from the specified file (same format as this file).
#   - The file must be accessible and contain all mandatory fields.
#   - Log settings (log_file, log_level, log_rotate_frequency) are always taken
#     from the original -p file and cannot be changed via TOOLOPTION.
#   - Startup fails with #ERROR if the file is not accessible or fails validation.
#
# Format 2 — Override individual parameters inline:
#
#   BACKUP DATA ALL USING BACKINT ('...') TOOLOPTION 'SCI_folderName=my-folder;tagging=true;object_tags=env=prod'
#
#   - Semicolon-separated key=value pairs. Keys must match the parameter names
#     in this file exactly (case-sensitive).
#   - Each valid key overrides the corresponding value from the -p file.
#   - Log fields (log_file, log_level, log_rotate_frequency) are warned and
#     silently ignored — they cannot be changed at runtime.
#   - Unknown keys are a hard error (#ERROR + backup fails).
#   - Invalid values (out of range, wrong type) are a hard error.
#   - Cross-field rules apply (e.g. sse_enabled=true requires sse_kms_key_id).
#
# Notes:
#   - HANA allows only one TOOLOPTION clause per SQL backup command.
#   - Single quotes must be used in the SQL command (SQL string literal).
#   - Maximum option string length: 512 bytes (enforced by HANA).

# ---------------------------------------------------------------------------
# Retry
# ---------------------------------------------------------------------------

# Number of retry attempts for failed S3 operations (0 = no retries).
# Default: 3
# retries=3

# ---------------------------------------------------------------------------
# Object tagging
# ---------------------------------------------------------------------------

# Enable S3 object tagging. Two auto-tags are always applied when enabled:
#   hdbbackint_version=<tool version>
#   db_version=<HANA version from #SOFTWAREID>
# Default: false
# tagging=false

# Custom object tags as comma-separated key=value pairs (max 5 custom tags).
# Only applied when tagging=true.
# Default: (none)
# object_tags=environment=prod,team=dba

# ---------------------------------------------------------------------------
# Upload performance tuning
# ---------------------------------------------------------------------------
#
# WARNING: Memory in-flight (worst case) = upload_part_size × upload_concurrency × upload_channel_size
# At defaults: 128 MiB × 32 × 10 = 40 GiB
# Ensure the host has sufficient RAM before using defaults.
# Conservative (32 GiB RAM):  upload_part_size=16MB  upload_concurrency=4  upload_channel_size=4  → 256 MiB
# Moderate   (64 GiB RAM):    upload_part_size=128MB upload_concurrency=8  upload_channel_size=4  → 4 GiB
#
# Recommended values for SCI CEPH RGW (benchmarked on eu-de-1, 2026-06-09):
#   upload_part_size=134217728  (128 MiB — fastest and most stable under sustained load)
#   upload_concurrency=32       (optimal concurrency on CEPH for 128 MiB parts)
#   upload_channel_size=10      (parallel files; tune based on available RAM and CPU)

# Multipart upload part size in bytes. Range: [5242880, 268435456] (5 MiB – 256 MiB).
# Default: 134217728 (128 MiB)
# upload_part_size=134217728

# Number of concurrent part uploads per file (SDK-level). Range: [1, 200].
# Default: 32
# upload_concurrency=32

# Number of files uploaded concurrently (application-level goroutine pool). Range: [1, 32].
# Default: 10
# upload_channel_size=10

# ---------------------------------------------------------------------------
# Server-side encryption (SSE-KMS via OpenStack Barbican)
# ---------------------------------------------------------------------------

# Enable per-object SSE-KMS encryption on all backup uploads.
# When enabled, every PutObject/CreateMultipartUpload call includes:
#   ServerSideEncryption=aws:kms  and  SSEKMSKeyId=<sse_kms_key_id>
# The bucket requires NO default encryption configuration.
# Restore (GetObject) is transparent — no config change needed for recovery.
# Default: false
# sse_enabled=true

# Barbican secret UUID to use as the KMS key.
# Prerequisites before setting this value:
#   1. Create the secret in Barbican:
#      openstack secret store --name hdbbackint-key \
#        --payload-content-type application/octet-stream \
#        --payload-content-encoding base64 \
#        --payload "$(openssl rand 32 | base64 -w0)"
#   2. Grant CEPH RGW service user read access:
#      openstack acl submit --user 1528befea7824c6296598697183f3f85 \
#        https://keymanager-3.<region>.cloud.sap:443/v1/secrets/<UUID>
#
# Key rotation: update this value to a new UUID — new backups use the new key,
# existing backups remain restorable using their own embedded key.
# WARNING: Never delete a Barbican key while backup objects encrypted with it
#          still exist. Deletion is permanent and those backups become unrecoverable.
# Default: (none)
# sse_kms_key_id=